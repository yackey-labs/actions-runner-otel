name: Build OTel runner image

# Separate from the upstream build.yml so upstream syncs never conflict.
# Triggered on every push to main; builds and pushes the OTel overlay image
# to ghcr.io/yackey-labs/actions-runner-otel.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  # contents: write so the build can cut a GitHub release for each published image.
  contents: write
  packages: write

jobs:
  build-otel-image:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 HOURS. A multi-arch buildx build here takes
    # ~8-10 minutes, so anything approaching 30 is wedged, not slow -- and the smoke
    # test below starts a runner process that is designed not to exit on its own.
    # Without this, one hung step burns a runner for a quarter of a day before anyone
    # notices.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Extract runner version and compute tags
        id: version
        run: |
          runner=$(grep -oP '(?<=actions-runner:)\S+' images/Dockerfile.otel | head -1)

          # <runner-version>-otel.<N> is valid SemVer: the pre-release is
          # "otel.N", and N is a NUMERIC identifier, so SemVer compares it
          # NUMERICALLY (9 < 10) rather than lexically. Runner version is
          # compared first, so 2.336.0-otel.999 still loses to 2.337.0-otel.1.
          #
          # This replaces a commit sha in that position. A sha is alphanumeric
          # and therefore unorderable -- nothing consuming these images could
          # tell a newer build from an older one, which meant no dependency
          # tooling could ever propose an upgrade. The sha is not lost; it moves
          # to org.opencontainers.image.revision below, which is where a build
          # provenance reference belongs.
          #
          # GITHUB_RUN_NUMBER is per-workflow and strictly increasing, so the
          # counter needs no state and cannot collide.
          echo "runner_version=${runner}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${runner}-otel.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${runner}-otel.latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: steveyackey
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile.otel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yackey-labs/actions-runner-otel:${{ steps.version.outputs.version_tag }}
            ghcr.io/yackey-labs/actions-runner-otel:${{ steps.version.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=GitHub Actions runner with OpenTelemetry job/step tracing
            io.yackey.runner.upstream-version=${{ steps.version.outputs.runner_version }}

      # Boot the image we just built. This is the gate the pipeline was missing.
      #
      # 2.336.0-otel.13 compiled, passed all seven build targets and the full test suite,
      # and then crashed on every job start:
      #
      #     System.IO.FileNotFoundException: Could not load file or assembly
      #     'System.Diagnostics.DiagnosticSource, Version=10.0.0.0'
      #        at GitHub.Runner.Worker.CiTracing.TryCreateTracerProvider()
      #
      # There is already a unit test that builds a real TracerProvider, and it passed --
      # because under `dotnet test` NuGet has placed DiagnosticSource 10.x in the output
      # directory, while the `dev.sh layout` that ships in the image has not. The test's
      # assembly closure is not the shipped layout's. Only starting the actual binary from
      # the actual image catches that class of regression.
      #
      # CiTracing.TryCreateTracerProvider() is the first statement in Runner.Worker's
      # Main, before HostContext is constructed, so a bare invocation reaches it. The
      # worker then exits non-zero on missing arguments, which is expected and ignored:
      # the assertion is on assembly-load failures in the output, not the exit code.
      - name: Smoke-test the built image
        # Tighter than the job bound: this step should take seconds. The inner
        # `timeout 45` handles the expected non-exiting worker; this is the backstop for
        # anything else (a stuck image pull, a hung docker daemon).
        timeout-minutes: 5
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version_tag }}
        run: |
          set -uo pipefail
          NAME="otel-smoke-${GITHUB_RUN_ID}"

          # Bounded, and a timeout is NOT a failure. Runner.Worker's ITerminal registers a
          # CTRL-C handler that deliberately keeps the process alive, so a bare invocation
          # may never exit on its own. Everything this check cares about happens in the
          # first statement of Main; if the assembly closure is broken the process is
          # already dead by then. So the exit code is ignored entirely -- including 124 --
          # and the assertion is purely on what was printed.
          out=$(timeout -k 5 45 docker run --rm --name "$NAME" \
                  --entrypoint /home/runner/bin/Runner.Worker \
                  -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \
                  -e OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf \
                  "$IMAGE" 2>&1 || true)
          # timeout kills the docker CLI, which does not always stop the container.
          docker rm -f "$NAME" >/dev/null 2>&1 || true

          echo "--- Runner.Worker output ---"
          echo "$out"
          echo "----------------------------"

          if echo "$out" | grep -qiE "Could not load file or assembly|FileNotFoundException|TypeLoadException|MissingMethodException|BadImageFormatException"; then
            echo "::error::Runner.Worker could not start from the built image with tracing enabled -- assembly closure is broken. Not cutting a release."
            exit 1
          fi
          echo "Runner.Worker started with tracing enabled; assembly closure is intact."

      # A release per published image. The image tag is already a monotonic, sortable
      # version (<runner-version>-otel.<N>), so it doubles as the git tag -- the Releases
      # tab then answers "what changed between .12 and .13" without reading git log, and
      # an incident has something to link to.
      #
      # Notes are generated through the API rather than `gh release create
      # --generate-notes`, because that flag cannot be combined with --notes and the
      # image coordinates are the part worth having.
      #
      # Not a prerelease. The smoke test above is the gate: a release is only cut for an
      # image whose runner has been started with tracing enabled. A prerelease flag that
      # nothing ever promotes decays into noise, so the boot check earns the release
      # instead of a label deferring the question.
      - name: Cut a release for this image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUNNER_VERSION: ${{ steps.version.outputs.runner_version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          GENERATED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body 2>/dev/null || echo "")

          {
            printf '**Image**\n\n```\n%s:%s\n%s@%s\n```\n\n' \
              "$IMAGE" "$TAG" "$IMAGE" "$DIGEST"
            printf 'Upstream runner `%s` — commit `%s`\n\n' "$RUNNER_VERSION" "$GITHUB_SHA"
            printf '> Runner.Worker was started from this image with tracing enabled before\n'
            printf '> the release was cut, so its OpenTelemetry assembly closure is known good.\n\n'
            printf -- '---\n\n%s\n' "$GENERATED"
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

          echo "Cut release $TAG"
